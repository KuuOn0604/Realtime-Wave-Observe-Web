version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000" # Express REST API + Socket.io (same server)
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./backend/.env
    command: npm run dev

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./ai_service:/app
    env_file:
      - ./ai_service/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
